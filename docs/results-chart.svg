<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Golden-set comparison results</title><desc id="desc">Grouped bar chart comparing the trivial, keyword and final systems on intent accuracy, macro F1, auto-handle coverage, auto-route precision and escalation recall over 200 reviewed messages.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.s{font-size:15px;fill:#475569}.l{font-size:14px}.v{font-size:14px;font-weight:700}.grid{stroke:#dbe3ec;stroke-width:1}.axis{stroke:#64748b;stroke-width:1.4}</style></defs>
  <rect width="1000" height="540" fill="#ffffff"/><text x="52" y="44" class="h">Golden-set comparison results</text><text x="52" y="70" class="s">200 AI-assisted, human-reviewed Delta messages · higher is better</text>
