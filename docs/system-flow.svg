<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Delta support agent decision flow</title><desc id="desc">A customer message is classified, matched to historical Delta cases, evaluated by safety rules, then either drafted for automatic handling or escalated with a reason.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3Z" fill="#64748b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.h{font-size:22px;font-weight:700}.k{font-size:17px;font-weight:700}.b{font-size:15px;fill:#475569}.card{stroke-width:2}.edge{stroke:#64748b;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="760" height="480" rx="12" fill="#ffffff"/><text x="30" y="42" class="h">Runtime decision flow</text><text x="30" y="68" class="b">The proposed reply is always tied to a retrieved historical Delta case.</text>
  <rect x="20" y="120" width="160" height="118" rx="12" fill="#f8fafc" stroke="#94a3b8" class="card"/><text x="100" y="157" text-anchor="middle" class="k">Incoming message</text><text x="100" y="185" text-anchor="middle" class="b">public tweet text</text><text x="100" y="207" text-anchor="middle" class="b">redacted first</text>
  <rect x="205" y="120" width="160" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" class="card"/><text x="285" y="157" text-anchor="middle" class="k">Classify intent</text><text x="285" y="185" text-anchor="middle" class="b">8 intents</text><text x="285" y="207" text-anchor="middle" class="b">confidence score</text>
  <rect x="390" y="120" width="160" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" class="card"/><text x="470" y="157" text-anchor="middle" class="k">Retrieve evidence</text><text x="470" y="185" text-anchor="middle" class="b">3 similar cases</text><text x="470" y="207" text-anchor="middle" class="b">reply + source ID</text>
  <rect x="575" y="120" width="165" height="118" rx="12" fill="#fffbeb" stroke="#d97706" class="card"/><text x="657" y="157" text-anchor="middle" class="k">Safety policy</text><text x="657" y="185" text-anchor="middle" class="b">risk + similarity</text><text x="657" y="207" text-anchor="middle" class="b">case-specific guard</text>
  <line x1="180" y1="179" x2="202" y2="179" class="edge"/><line x1="365" y1="179" x2="387" y2="179" class="edge"/><line x1="550" y1="179" x2="572" y2="179" class="edge"/><text x="30" y="294" class="k">Route only when all policy checks pass</text>
  <path d="M657,238 V302 H245 V337" class="edge"/><path d="M657,302 H565 V337" class="edge"/>
  <rect x="115" y="340" width="260" height="105" rx="12" fill="#ecfdf5" stroke="#059669" class="card"/><text x="245" y="378" text-anchor="middle" class="k">Auto-handle</text><text x="245" y="405" text-anchor="middle" class="b">high-confidence, non-transactional</text><text x="245" y="427" text-anchor="middle" class="b">draft with historical provenance</text>
  <rect x="435" y="340" width="260" height="105" rx="12" fill="#fffbeb" stroke="#d97706" class="card"/><text x="565" y="378" text-anchor="middle" class="k">Escalate to a human</text><text x="565" y="405" text-anchor="middle" class="b">sensitive, transactional, or uncertain</text><text x="565" y="427" text-anchor="middle" class="b">specific, inspectable reason</text>
</svg>
