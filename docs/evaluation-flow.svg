<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
  <title id="title">Delta support agent evaluation flow</title><desc id="desc">A blinded 200-message golden set is labelled by a human, excluded from training, evaluated against three systems, and used for automated metrics and LLM-judge validity checks.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3Z" fill="#64748b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.h{font-size:22px;font-weight:700}.k{font-size:17px;font-weight:700}.b{font-size:15px;fill:#475569}.card{stroke-width:2}.edge{stroke:#64748b;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="760" height="490" rx="12" fill="#ffffff"/><text x="30" y="42" class="h">Evidence-first evaluation flow</text><text x="30" y="68" class="b">No model-quality metrics are published until the golden labels are complete.</text>
  <rect x="35" y="118" width="200" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" class="card"/><text x="135" y="155" text-anchor="middle" class="k">30,000 linked pairs</text><text x="135" y="184" text-anchor="middle" class="b">Delta customer → reply</text><text x="135" y="206" text-anchor="middle" class="b">deterministic data cut</text>
  <rect x="280" y="118" width="200" height="118" rx="12" fill="#fffbeb" stroke="#d97706" class="card"/><text x="380" y="155" text-anchor="middle" class="k">Blinded golden set</text><text x="380" y="184" text-anchor="middle" class="b">200 customer messages</text><text x="380" y="206" text-anchor="middle" class="b">human intent + route labels</text>
  <rect x="525" y="118" width="200" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" class="card"/><text x="625" y="155" text-anchor="middle" class="k">Leakage-safe train</text><text x="625" y="184" text-anchor="middle" class="b">exclude golden IDs</text><text x="625" y="206" text-anchor="middle" class="b">fit remaining examples</text>
  <line x1="235" y1="177" x2="277" y2="177" class="edge"/><line x1="480" y1="177" x2="522" y2="177" class="edge"/><path d="M625,236 V282 H380 V312" class="edge"/>
  <rect x="245" y="315" width="270" height="105" rx="12" fill="#ecfdf5" stroke="#059669" class="card"/><text x="380" y="351" text-anchor="middle" class="k">Compare the same 200 rows</text><text x="380" y="379" text-anchor="middle" class="b">trivial · keyword rules · final agent</text><text x="380" y="401" text-anchor="middle" class="b">identical inputs, reproducible exports</text>
  <path d="M380,420 V445 H205" class="edge"/><path d="M380,445 H555" class="edge"/><text x="205" y="463" text-anchor="middle" class="k">Intent + routing metrics</text><text x="555" y="463" text-anchor="middle" class="k">Reply quality + judge agreement</text>
</svg>
